    <style>

        :root {
            --primary: #c44dff;
            --primary-light: #d77bff;
            --accent: #ff6b9d;
            --accent-2: #6b5ce7;
            --bg-dark: #06060f;
            --bg-card: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.08);
            --text: #e8e8f0;
            --text-muted: #7a7a9a;
            --glow-primary: rgba(196, 77, 255, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        .bg-canvas { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; }
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); animation: orbit 20s ease-in-out infinite; }
        .bg-orb-1 { width: 600px; height: 600px; background: radial-gradient(circle, rgba(196,77,255,0.12), transparent 70%); top: -200px; left: -100px; }
        .bg-orb-2 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,107,157,0.1), transparent 70%); top: 40%; right: -150px; }
        .grid-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px); background-size: 60px 60px; }
        .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; width: 100%; }
        
        nav { padding: 16px 0; backdrop-filter: blur(20px); background: rgba(6,6,15,0.7); border-bottom: 1px solid var(--border); }
        .nav-inner { display: flex; align-items: center; justify-content: space-between; max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; text-decoration: none; color: var(--text); }
        .nav-brand span { background: linear-gradient(135deg, var(--accent), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 32px; align-items: center; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color 0.2s; }
        .nav-links a:hover { color: var(--text); }
        
        .hero { padding: 100px 0 60px; text-align: center; }
        .hero h1 { font-size: 3rem; font-weight: 900; margin-bottom: 20px; }
        .hero h1 .gradient { background: linear-gradient(135deg, var(--accent), var(--primary), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { font-size: 1.1rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 40px; line-height: 1.7; }
        
        .btn-primary { display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(135deg, var(--primary), var(--accent-2)); color: white !important; text-decoration: none; padding: 16px 36px; border-radius: 12px; font-size: 1rem; font-weight: 700; transition: all 0.3s; box-shadow: 0 4px 25px var(--glow-primary); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 40px var(--glow-primary); }
        .btn-secondary { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); text-decoration: none; padding: 16px 28px; border-radius: 12px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-card); transition: all 0.3s; }
        .btn-secondary:hover { border-color: rgba(255,255,255,0.15); color: var(--text); transform: translateY(-2px); }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 40px; padding-bottom: 80px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; transition: all 0.4s; text-align: left; text-decoration: none; color: inherit; display: block; position: relative; overflow: hidden; }
        .card:hover { border-color: rgba(196,77,255,0.25); background: rgba(255,255,255,0.05); transform: translateY(-6px); box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .card img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 20px; object-fit: contain; background: rgba(0,0,0,0.2); padding: 4px; }
        .card h3 { font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; color: #fff; }
        .card p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
        .card .btn-card { display: inline-block; font-size: 0.85rem; font-weight: 600; color: var(--primary-light); background: rgba(196,77,255,0.1); padding: 6px 14px; border-radius: 100px; }
        
        footer { padding: 40px 0; border-top: 1px solid var(--border); text-align: center; margin-top: auto; }
        footer p { font-size: 0.82rem; color: var(--text-muted); }
        footer a { color: var(--primary-light); text-decoration: none; }

    </style>
</head>
